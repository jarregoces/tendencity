name: Revisar carpetas FTP Colombia

# Solo lista carpetas (no sube ni borra nada). Corre al cambiar este archivo, o a mano desde Actions.
on:
  push:
    paths: ['.github/workflows/ftp-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: colombia
    steps:
      - name: Listar carpetas del FTP
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          ls_ftp() { echo "===== /$1"; curl -sS --ssl-reqd --max-time 30 -u "$U:$P" "ftp://$S/$1" 2>&1 || echo "(no existe o sin acceso)"; }
          echo "IP del servidor FTP:     $(getent hosts "$S" | awk '{print $1}')"
          echo "IP de tendencity.shop:   $(getent hosts tendencity.shop | awk '{print $1}')"
          echo "Nombres que trae el certificado del FTP (usa uno de estos como FTP_SERVER):"
          echo | timeout 20 openssl s_client -starttls ftp -connect "$S:21" 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName || true
          echo "DNS tendencity.shop:"; for t in A AAAA NS; do echo "  $t: $(dig +short $t tendencity.shop | tr '\n' ' ')"; done
          echo "  www: $(dig +short www.tendencity.shop | tr '\n' ' ')"
          for u in https://tendencity.shop/ https://www.tendencity.shop/ http://tendencity.shop/; do
            echo "--- $u"; curl -s -o /tmp/b.html -m 20 -w "  codigo %{http_code} ip %{remote_ip} redirige %{redirect_url}\n" "$u" || true
            grep -io '<title>[^<]*' /tmp/b.html | head -1 || true; curl -sI -m 20 "$u" | grep -i '^server' || true
          done
          echo "--- tendencity.shop forzado a la IP del hosting (172.93.120.110):"
          curl -s -o /tmp/b.html -m 20 --resolve tendencity.shop:443:172.93.120.110 -w "  codigo %{http_code}\n" https://tendencity.shop/ || true
          grep -io '<title>[^<]*' /tmp/b.html | head -1 || true
          echo "Carpeta inicial de la cuenta FTP:"
          curl -sv --ssl-reqd --max-time 30 -u "$U:$P" "ftp://$S/" -o /dev/null 2>&1 | grep -E '< 257' || true
          ls_ftp ""
          ls_ftp "public_html/"
          ls_ftp "public_html/public/"
          ls_ftp "public_html/public/uploads/"
          ls_ftp "public_html/public/assets/css/"
          